<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07101c" />
    <title>哈尔滨线路漫游 · CnTrainHub</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307101c'/%3E%3Cpath d='M4 24h24M8 24V13a4 4 0 0 1 4-4h9l6 7v8' stroke='%23e8b34a' stroke-width='2.2' fill='none' stroke-linejoin='round'/%3E%3Cpath d='M6 28h20' stroke='%234a86c8' stroke-width='1.6'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="vignette" aria-hidden="true"></div>

    <header id="topbar">
      <a id="back" href="./index.html">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        路网
      </a>
      <div id="ident">
        <h1>哈尔滨 · 线路漫游</h1>
        <p id="journey-sub">真实里程驱动的分块场景</p>
      </div>
      <div id="topright">
        <select id="start-select" aria-label="选择出发高铁站"></select>
        <select id="route-select" aria-label="选择线路"></select>
        <span id="livery-tag">按里程加载</span>
      </div>
    </header>

    <aside id="dock" aria-label="漫游控制台">
      <div class="dock-scroll">
        <section class="grp">
          <h2>车底</h2>
          <div class="row"><label for="c-model">动车组</label><select id="c-model"></select></div>
          <div class="row"><label for="c-formation">编组</label><select id="c-formation"><option value="8">8 辆标准编</option><option value="16">16 辆长编</option></select></div>
          <p class="hintline" id="train-note">CR400BF-GZ · 8 辆 · 208.95 m</p>
        </section>

        <section class="grp">
          <h2>运行</h2>
          <div class="row"><label for="c-speed">演示速度</label><output id="o-speed">120 km/h</output><input id="c-speed" type="range" min="0" max="300" step="5" value="120" /></div>
          <div class="row"><label for="c-accel">加速度</label><output id="o-accel">18 m/s²</output><input id="c-accel" type="range" min="2" max="60" step="1" value="18" /></div>
          <div class="progress"><i id="progress-fill"></i></div>
          <p class="hintline" id="progress-label">0.0 / 0.0 km</p>
        </section>

        <section class="grp">
          <h2>机位</h2>
          <div class="row"><label for="c-view">预设机位</label><select id="c-view"></select></div>
          <div class="row"><label for="c-fov">视野</label><output id="o-fov">52°</output><input id="c-fov" type="range" min="25" max="82" step="1" value="52" /></div>
          <div class="row switch"><label for="c-follow">镜头跟随</label><input id="c-follow" type="checkbox" class="tgl" checked /></div>
        </section>

        <section class="grp">
          <h2>场景</h2>
          <div class="row"><label for="c-theme">时段</label><select id="c-theme"><option value="day" selected>晴昼</option><option value="dusk">暮色</option><option value="night">寒夜</option></select></div>
          <div class="row"><label for="c-ahead">前方视距</label><output id="o-ahead">7 块</output><input id="c-ahead" type="range" min="3" max="10" step="1" value="7" /></div>
          <div class="row"><label for="c-density">建筑密度</label><output id="o-density">75%</output><input id="c-density" type="range" min="0" max="100" step="5" value="75" /></div>
          <div class="row switch"><label for="c-buildings">城市建筑</label><input id="c-buildings" type="checkbox" class="tgl" checked /></div>
          <div class="row switch"><label for="c-stations">站房与站场</label><input id="c-stations" type="checkbox" class="tgl" checked /></div>
          <div class="row switch"><label for="c-rural">郊外地形</label><input id="c-rural" type="checkbox" class="tgl" checked /></div>
          <div class="row switch"><label for="c-wire">线框模式</label><input id="c-wire" type="checkbox" class="tgl" /></div>
          <div class="row"><label for="c-quality">画质</label><select id="c-quality"><option value="low">流畅</option><option value="mid" selected>均衡</option><option value="high">精细</option></select></div>
        </section>

        <section class="grp">
          <h2>动作</h2>
          <div class="acts">
            <button id="a-reset" type="button">重置</button>
            <button id="a-export" type="button" class="primary">导出 PNG</button>
          </div>
          <p class="stat" id="stat">—</p>
        </section>
      </div>
    </aside>

    <div id="console">
      <div id="gauge">
        <div id="gauge-num"><span id="kmh">0</span><em>km/h</em></div>
        <div id="gauge-bar"><i id="gauge-fill"></i></div>
        <div id="gauge-meta"><span id="odo">0.00 km</span><span id="state">停车</span></div>
      </div>
      <button id="run" type="button"><span class="dot"></span><span id="run-label">前进</span></button>
      <p id="hint">拖动旋转 · 滚轮缩放 · 空格启停</p>
    </div>

    <dl id="specs">
      <div><dt>线路</dt><dd id="sp-route">—</dd></div>
      <div><dt>官方里程</dt><dd id="sp-km">—</dd></div>
      <div><dt>下一节点</dt><dd id="sp-next">—</dd></div>
      <div><dt>驻留块</dt><dd id="sp-chunks">—</dd></div>
    </dl>

    <div id="notice" role="status"></div>

    <div id="loader">
      <p id="loader-msg">正在生成哈尔滨线路场景…</p>
      <div class="ldr-bar"><i></i></div>
    </div>

    <div id="fallback" hidden>
      <div class="fb-card">
        <h2 id="fallback-title">无法启动场景</h2>
        <p id="fallback-msg"></p>
        <a href="./index.html">返回路网</a>
      </div>
    </div>

    <script type="module" src="/src/journey/journey.js"></script>
  </body>
</html>
